name: Debian packages

# Every push and PR builds the packages. A tag "v<version>" additionally
# publishes them to the apt repository (GitHub Pages of APT_REPO).
# Setup: packaging/apt/README.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  APT_REPO: tridexdarts/nexus-apt

jobs:
  build:
    # The trixie container matches the board's Debian release.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts equivs git ca-certificates

      - uses: actions/checkout@v4

      - name: Check that the tag matches debian/changelog
        if: github.ref_type == 'tag'
        run: |
          v=$(dpkg-parsechangelog -S Version)
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $v"; exit 1
          fi
          if [ "$(dpkg-parsechangelog -S Distribution)" = UNRELEASED ]; then
            echo "::error::debian/changelog $v is still UNRELEASED; finalize it with dch -r"; exit 1
          fi

      - name: Give untagged builds a snapshot version
        # Debian-style snapshot versions, so a test build never carries the
        # version of a release: while the top changelog entry is UNRELEASED
        # (work towards that version) "0.2.0~git…" sorts before 0.2.0; on top
        # of a released entry "0.1.0+git…" sorts after 0.1.0 and before the
        # next release. Only the build tree is changed, nothing is committed.
        if: github.ref_type != 'tag'
        env:
          DEBFULLNAME: Nexus CI
          DEBEMAIL: ci@invalid
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(dpkg-parsechangelog -S Version)
          if [ "$(dpkg-parsechangelog -S Distribution)" = UNRELEASED ]; then sep='~'; else sep='+'; fi
          snap="$v${sep}git$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%d.%H%M%S).$(git rev-parse --short=7 HEAD)"
          dch -b -v "$snap" -D UNRELEASED "Snapshot build of $(git rev-parse HEAD)."
          echo "Building $snap"

      - name: Install build dependencies
        run: mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control

      - name: Build
        # The only arch-specific package (nexus-web-terminal) contains no
        # compiled code, just the downloaded ttyd for aarch64, so building
        # "for arm64" on an x86 runner needs no cross compiler. -d: the build
        # dependencies are tools, installed natively above.
        run: |
          dpkg-buildpackage -us -uc -b --host-arch=arm64 -d
          mkdir dist
          mv ../*.deb dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    container: debian:trixie
    # Two tags pushed at once must not race on the apt repository.
    concurrency: apt-repo
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends apt-utils gnupg git openssh-client ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist

      - name: Check out apt repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APT_REPO }}
          ssh-key: ${{ secrets.APT_REPO_DEPLOY_KEY }}
          path: apt-repo

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Add packages and sign the index
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: packaging/apt/publish.sh apt-repo dist/*.deb

      - name: Push apt repository
        working-directory: apt-repo
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "nexus $GITHUB_REF_NAME"
          git push
