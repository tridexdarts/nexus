# Installed by nexus-captive-portal. comitup starts and stops comitup-web.service
# with the hotspot; this makes it run the Nexus portal, which asks for the
# admin password before the Wi-Fi list, as an unprivileged user instead of
# comitup's own web app as root.
[Service]
ExecStart=
ExecStart=/usr/lib/nexus-captive-portal/nexus-portal
User=nexus-portal
Group=nexus-portal
# Port 80 is all the extra privilege it gets.
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE

# Only hotspot clients: someone on the Ethernet LAN must not be able to set
# the admin password of a fresh board.
IPAddressAllow=10.41.0.0/24
IPAddressDeny=any

ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
