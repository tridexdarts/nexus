# comitup configuration for the Nexus board (Radxa CM3).
# Shipped as /usr/share/nexus/comitup.conf; /etc/comitup.conf links here
# (nexus-captive-portal diverts comitup's own copy to /etc/comitup.conf.distrib).
# Change it here and release a new package — edits on the board are overwritten.
# Every option is documented in the package's original file and in comitup.conf(5).

# Hotspot name, shown on the phone. <nnn> becomes a persistent per-device number,
# so several boards on the bench stay distinguishable.
ap_name: Nexus-<nnn>

# Without a password the hotspot is open, which is what makes the portal pop up
# without any typing. Set one (8–63 chars) to restrict who can provision the board;
# reboot after changing it.
# ap_password: changeme123

# Called with HOTSPOT, CONNECTING or CONNECTED on every state change.
# Reboots the board once after a successful provisioning (see bin/nexus-comitup-callback).
external_callback: /usr/sbin/nexus-comitup-callback

# The CM3's on-board radio. Pin it so a USB Wi-Fi stick cannot take over the hotspot.
# primary_wifi_device: wlan0

# Keep the upstream Wi-Fi reachable over IPv6 only via link-local addresses.
ipv6_link_local: 1

# 1 = verbose logging to /var/log/comitup.log. Useful while bringing the board up.
verbose: 0
